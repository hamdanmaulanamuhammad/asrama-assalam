services:
  db:
    image: postgres:16-alpine
    container_name: presensi-db
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./users_rows.sql:/docker-entrypoint-initdb.d/02-users_rows.sql:ro
      - ./attendance_rows.sql:/docker-entrypoint-initdb.d/03-attendance_rows.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: presensi-app
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "${PORT:-3001}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
